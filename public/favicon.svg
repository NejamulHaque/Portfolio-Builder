  <!-- Glow Layer -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Modern Stylized 'P' Glyph with AI Sparkle -->
  <path d="M160 120 H280 C346.274 120 400 173.726 400 240 C400 306.274 346.274 360 280 360 H224 V416 C224 429.255 213.255 440 200 440 H184 C170.745 440 160 429.255 160 416 V120 Z M224 184 V296 H280 C310.928 296 336 270.928 336 240 C336 209.072 310.928 184 280 184 H224 Z" fill="url(#bgGrad)" />
  
  <!-- Sparkle Accent Top Right -->
  <path d="M390 100 Q410 120 430 120 Q410 120 390 140 Q390 120 370 120 Q390 120 390 100 Z" fill="#F43F5E" />
  <circle cx="430" cy="80" r="8" fill="#A855F7" />
